{% extends 'layout/base.html' %}
{% set active_page = 'layanan' %}
{% block title %}Edit Layanan - Laundry Berkah{% endblock %}
{% block page_title %}<i class="fas fa-edit"></i> Edit Layanan{% endblock %}
{% block styles %}
<style>
.form-label { font-weight: 600; color: #1e293b; margin-bottom: 8px; font-size: 14px; }
</style>
{% endblock %}
{% block content %}
<div class="card" style="max-width: 700px;">
    <div class="card-header">
        <i class="fas fa-edit"></i> Form Edit Layanan
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('layanan.edit', id_layanan=layanan.id_layanan) }}" novalidate>
            <div class="form-group">
                <label class="form-label">Nama Layanan <span style="color: var(--danger);">*</span></label>
                <input type="text" class="form-control" name="nama" required value="{{ form_data.get('nama') if form_data else layanan.nama }}">
            </div>
            <div class="form-group">
                <label class="form-label">Harga <span style="color: var(--danger);">*</span></label>
                <div class="input-group">
                    <span class="input-group-text">Rp</span>
                    <input type="number" class="form-control" name="harga" required min="0" step="100" value="{{ form_data.get('harga') if form_data else layanan.harga }}">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Durasi <span style="color: var(--danger);">*</span></label>
                        <input type="number" class="form-control" name="durasi" required min="1" value="{{ form_data.get('durasi') if form_data else layanan.durasi }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label">Satuan Durasi <span style="color: var(--danger);">*</span></label>
                        <select class="form-select" name="durasi_unit" required>
                            <option value="">-- Pilih Satuan --</option>
                            {% for unit in durasi_unit_list %}
                            {% set selected_unit = form_data.get('durasi_unit') if form_data else layanan.durasi_unit %}
                            <option value="{{ unit }}" {% if selected_unit == unit %}selected{% endif %}>{{ unit }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Kategori <span style="color: var(--danger);">*</span></label>
                <select class="form-select" name="kategori" required>
                    <option value="">-- Pilih Kategori --</option>
                    {% for kat in kategori_list %}
                    {% set selected_kategori = form_data.get('kategori') if form_data else layanan.kategori %}
                    <option value="{{ kat }}" {% if selected_kategori == kat %}selected{% endif %}>{{ kat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Deskripsi</label>
                <textarea class="form-control" name="deskripsi" rows="4">{{ form_data.get('deskripsi') if form_data else layanan.deskripsi }}</textarea>
            </div>
            <div class="form-group" style="margin-top: 30px;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Simpan Perubahan
                </button>
                <a href="{{ url_for('layanan.index') }}" class="btn btn-secondary ms-2">
                    <i class="fas fa-times"></i> Batal
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
